# /etc/nginx/sites-available/dwa-site
#
# Terminates TLS and proxies to the Next.js process on 127.0.0.1:3000.
# The app is never exposed directly.

upstream dwa_site {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate limits for the unauthenticated tools. The app enforces its own limits in
# Postgres; this is the cheap first line that never reaches Node.
limit_req_zone $binary_remote_addr zone=dwa_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=dwa_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name developwitharim.com www.developwitharim.com;

    # Certbot needs this reachable over plain HTTP to renew.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name developwitharim.com www.developwitharim.com;

    ssl_certificate     /etc/letsencrypt/live/developwitharim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/developwitharim.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # A lead form and two JSON tools; nothing here should be large.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Immutable build assets - safe to cache hard because the filenames hash.
    location /_next/static/ {
        proxy_pass http://dwa_site;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/admin/login {
        limit_req zone=dwa_login burst=5 nodelay;
        proxy_pass http://dwa_site;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=dwa_api burst=10 nodelay;
        proxy_pass http://dwa_site;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://dwa_site;
        include /etc/nginx/proxy_params;
    }
}
